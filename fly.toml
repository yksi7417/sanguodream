# The fly.io site of the web game (docs/WEB.md, "The fly.io site").
# The secrets (SESSION_SECRET, RESEND_API_KEY, EMAIL_FROM, the keys of the sign-in
# providers, of the bucket and of YouTube) are not in this repository.
app = 'sanguodream'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '60s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
